[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20.20.2"

[build.processing.html]
  pretty_urls = false

# Permanent canonical redirect for the legacy English route.
[[redirects]]
  from = "/how-it-works"
  to = "/como-funciona"
  status = 301
  force = true

# Public and authenticated React routes. These rewrites preserve direct access
# and refreshes without turning every unknown URL into a 200 response.
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/registro"
  to = "/index.html"
  status = 200

