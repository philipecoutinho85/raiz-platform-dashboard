name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing required secret SUPABASE_PROJECT_REF"
            exit 1
          fi

          echo "Required secrets are present."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Deploy selected Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          functions=(
            "stripe-token-webhook"
            "verify-token-payment"
            "stripe-webhook"
            "stripe-create-payment"
            "process-withdrawal"
            "stripe-request-payout"
            "admin-reconcile-token-purchase"
          )

          for function_name in "${functions[@]}"; do
            echo "::group::Deploy ${function_name}"
            echo "Deploying Supabase Edge Function: ${function_name}"

            supabase functions deploy "${function_name}" \
              --project-ref "${SUPABASE_PROJECT_REF}" \
              --use-api \
              --debug

            echo "Deploy completed successfully: ${function_name}"
            echo "::endgroup::"
          done

          echo "All selected Supabase Edge Functions were deployed successfully."
