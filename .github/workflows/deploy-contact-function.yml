name: Deploy Contact Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-contact-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-contact-email function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-contact-email --project-ref oefkzjyqjjfzfrmovfdt
